[package]
name = "ordoc-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Front do Ordoc: Leptos (CSR) em WASM, servido pelo Tauri v2. Só fala com o back por comandos Tauri."
publish = false

# Fora do workspace da raiz: compila para wasm32-unknown-unknown com o trunk
# (`trunk build --release` nesta pasta; ver documentação interna).
[workspace]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage"] }
# Contrato com o back (tipos de ordoc_core::visao): o domínio é puro e compila em WASM.
ordoc-core = { path = "../ordoc-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
